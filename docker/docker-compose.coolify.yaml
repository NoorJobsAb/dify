    - "if apt-get update -qq &&\n   apt-get install -y -qq --no-install-recommends ca-certificates curl libicu72 > /dev/null &&\n   cd /opt/dify-agent-tools && rm -rf dotnet.new icu.new bin.new && mkdir dotnet.new icu.new bin.new &&\n   curl -fsSL https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh &&\n   bash /tmp/dotnet-install.sh --channel LTS --install-dir /opt/dify-agent-tools/dotnet.new &&\n   cp -a /usr/lib/x86_64-linux-gnu/libicu*.so.72* icu.new/ &&\n   printf '%s\\n' '#!/bin/sh' 'mkdir -p \"$$HOME/.dotnet/corefx/Runtime/SharedMemory/.dotnet/shm\" 2>/dev/null' 'exec /opt/dify-agent-tools/dotnet/dotnet \"$$@\"' > bin.new/dotnet &&\n   rm -rf dotnet icu bin && mv dotnet.new dotnet && mv icu.new icu && mv bin.new bin &&\n   chmod -R a+rX /opt/dify-agent-tools && chmod 755 bin/dotnet\nthen echo \"sandbox_tools: ready\"\nelse echo \"sandbox_tools: install failed; keeping the previous tools\"\nfi\nexit 0\n"
