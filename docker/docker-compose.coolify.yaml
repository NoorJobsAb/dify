# Dify for Coolify, built from the upstream docker/docker-compose.yaml of the same release.
#
# Coolify edits:
# - Coolify replaces every service's env_file with its own .env, so the envs/**/*.defaults values are
#   inlined into each service's environment (values still read Coolify's variables, like upstream).
#   The vector store defaults are weaviate's (VECTOR_STORE=weaviate).
# - Unused optional services (other databases, vector stores, KnowledgeFS, certbot) are dropped.
# - Coolify pre-creates single-file bind sources as directories, so nginx and the squid proxies mount
#   their config folder read-only and copy the files in.
# - TLS is terminated by the Coolify proxy: no published nginx ports and no certificate mounts.
# - browsermesh: headless browser the Dify test agent drives over MCP (http://browsermesh:8932/mcp).
#   No auth, so internal network only; never give it a domain. local_sandbox shares browsermesh_states
#   at /browser-states to write login states that browser sessions load by stateId.

services:
  init_permissions:
    image: busybox:latest
    command:
    - sh
    - -c
    - "FLAG_FILE=\"/app/api/storage/.init_permissions\"\nif [ -f \"$${FLAG_FILE}\" ]; then\n  echo \"Permissions already initialized. Exiting.\"\n  exit 0\nfi\necho \"Initializing permissions for /app/api/storage\"\nchown -R 1001:1001 /app/api/storage && touch \"$${FLAG_FILE}\"\necho \"Permissions initialized. Exiting.\"\n"
    volumes:
    - ./volumes/app/storage:/app/api/storage
    restart: 'no'
  api:
    networks:
    - ssrf_proxy_network
    - default
    restart: always
    image: langgenius/dify-api:1.19.0
    environment:
      WEAVIATE_PERSISTENCE_DATA_PATH: ${WEAVIATE_PERSISTENCE_DATA_PATH:-/var/lib/weaviate}
